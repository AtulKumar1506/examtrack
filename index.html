<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamTrack — Student Exam Preparation Tracker</title>
  <meta name="description" content="Organize your subjects, create study plans, track your preparation, and stay consistent until exam day." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Custom App Styles -->
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 transition-colors duration-200">
  
  <!-- Global Top Navigation Header -->
  <div id="navbar-container"></div>

  <!-- Dynamic Routed Content Container -->
  <main id="main-content" class="flex-1 w-full"></main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

  <!-- Application Scripts -->
  <script src="./js/data/initialData.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/components/navbar.js"></script>
  <script src="./js/components/landing.js"></script>
  <script src="./js/components/auth.js"></script>
  <script src="./js/components/dashboard.js"></script>
  <script src="./js/components/subjects.js"></script>
  <script src="./js/components/subjectDetail.js"></script>
  <script src="./js/components/planner.js"></script>
  <script src="./js/components/timer.js"></script>
  <script src="./js/components/analytics.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
